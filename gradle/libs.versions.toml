[versions]
apollo = "5.1.0"
federation = "6.2.1"
kotlin = "2.4.10"
kotlinx-html = "0.12.0"
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"

[plugins]
apollo = { id = "com.apollographql.apollo", version.ref = "apollo" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

[libraries]
apollo-runtime = { group = "com.apollographql.apollo", name = "apollo-runtime", version.ref = "apollo" }
federation-graphql-java-support = { group = "com.apollographql.federation", name = "federation-graphql-java-support", version.ref = "federation" }
jackson-module-kotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect" }
kotlinx-html = { group = "org.jetbrains.kotlinx", name = "kotlinx-html", version.ref = "kotlinx-html" }
spring-boot-starter-graphql = { group = "org.springframework.boot", name = "spring-boot-starter-graphql" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web" }
spring-graphql-test = { group = "org.springframework.graphql", name = "spring-graphql-test" }
spring-webflux = { group = "org.springframework", name = "spring-webflux" }

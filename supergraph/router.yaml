supergraph:
  listen: 0.0.0.0:4000
# Send telemetry to 100% of requests
# See https://www.apollographql.com/docs/graphos/routing/observability/graphos/graphos-reporting#configuring-the-apollo-studio-sampling-rate
telemetry:
  apollo:
    field_level_instrumentation_sampler: 1
  exporters:
    tracing:
      common:
        sampler: 1
# See https://www.apollographql.com/docs/graphos/routing/security/cors
cors:
  allow_any_origin: true
